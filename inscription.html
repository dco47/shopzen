<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Créez votre compte ShopZen pour retrouver votre sélection."
    />
    <title>Créer un compte | ShopZen</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="signup-page">
    <main class="signup-card">
      <a class="signup-brand" href="index.html" aria-label="ShopZen, accueil">
        Shop<span>Zen</span>
      </a>
      <header class="signup-heading">
        <h1>Créer un compte</h1>
        <p>Inscrivez-vous pour commencer</p>
      </header>

      <form id="signup-form" class="signup-form">
        <div class="signup-name-fields">
          <div class="signup-field">
            <label for="prenom">Prénom</label>
            <input
              id="prenom"
              name="prenom"
              type="text"
              placeholder="Jean"
              autocomplete="given-name"
              required
            />
          </div>
          <div class="signup-field">
            <label for="nom">Nom</label>
            <input
              id="nom"
              name="nom"
              type="text"
              placeholder="ZEZE"
              autocomplete="family-name"
              required
            />
          </div>
        </div>

        <div class="signup-field">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="vous@exemple.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="signup-field">
          <label for="mot-de-passe">Mot de passe</label>
          <div class="signup-password-wrap">
            <input
              id="mot-de-passe"
              name="mot-de-passe"
              type="password"
              placeholder="8 caractères minimum"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="Afficher le mot de passe"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="2.5"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path
                  class="password-eye-slash"
                  d="m4 4 16 16"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <span class="signup-hint">8 caractères minimum</span>
        </div>

        <div class="signup-field">
          <label for="confirmation">Confirmer le mot de passe</label>
          <input
            id="confirmation"
            name="confirmation"
            type="password"
            placeholder="Saisissez à nouveau votre mot de passe"
            autocomplete="new-password"
            required
          />
        </div>

        <label class="signup-consent" for="conditions">
          <input id="conditions" name="conditions" type="checkbox" required />
          <span>
            J’accepte les
            <a href="#conditions-texte">conditions d’utilisation</a> et la
            <a href="#confidentialite-texte">politique de confidentialité</a>.
          </span>
        </label>

        <p
          id="signup-feedback"
          class="signup-feedback"
          role="status"
          aria-live="polite"
        ></p>

        <button class="signup-submit" type="submit">Créer mon compte</button>
      </form>

      <p class="signup-login">
        Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a>
      </p>
      <a class="signup-home-link" href="index.html">Retour à la boutique</a>

      <div class="signup-legal" aria-label="Informations légales">
        <p id="conditions-texte">
          En créant un compte, vous acceptez les conditions d’utilisation de
          ShopZen.
        </p>
        <p id="confidentialite-texte">
          Vos informations personnelles sont utilisées pour gérer votre compte.
        </p>
      </div>
    </main>
    <script src="js/inscription.js"></script>
  </body>
</html>

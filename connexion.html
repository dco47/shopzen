<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connectez-vous à votre compte ShopZen." />
    <title>Se connecter | ShopZen</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="signup-page">
    <main class="signup-card">
      <a class="signup-brand" href="index.html" aria-label="ShopZen, accueil">
        Shop<span>Zen</span>
      </a>

      <header class="signup-heading">
        <h1>Se connecter</h1>
        <p>Ravi de vous retrouver</p>
      </header>

      <form
        class="signup-form"
        id="formulaire-connexion"
        action="/connexion"
        method="post"
      >
        <div class="signup-field">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="vous@exemple.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="signup-field">
          <label for="mot-de-passe">Mot de passe</label>
          <input
            id="mot-de-passe"
            name="mot-de-passe"
            type="password"
            placeholder="Saisissez votre mot de passe"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="signup-submit" type="submit">Se connecter</button>
        <p id="message-connexion" role="status" aria-live="polite"></p>
      </form>

      <p class="signup-login">
        Vous n’avez pas encore de compte ?
        <a href="inscription.html">Créer un compte</a>
      </p>
      <a class="signup-home-link" href="index.html">Retour à la boutique</a>
    </main>

    <script src="js/connexion.js"></script>
  </body>
</html>
